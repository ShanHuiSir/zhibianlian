    <mask id="node" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="white"/>
      <path d="M256 232 280 256 256 280 232 256Z" fill="black"/>
    </mask>
  </defs>
  <g mask="url(#node)">
    <path fill="#087f77" d="M104 96H360L424 160 264 320 216 272 328 160H104Z"/>
    <path fill="#142e32" d="M408 416H152L88 352 248 192 296 240 184 352H408Z"/>
  </g>
</svg>
